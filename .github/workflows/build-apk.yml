name: 📦 Gerar APK via PWABuilder NetcodeBR

on:
  workflow_dispatch:
    inputs:
      pwa_url:
        description: "🌐 URL do seu PWA"
        required: true
        default: "https://netcodebr.github.io/storage/"
      app_name:
        description: "🧱 Nome do aplicativo"
        required: true
        default: "Storage"
      package_id:
        description: "📦 ID do pacote (ex: br.com.netcodebr.storage)"
        required: true
        default: "br.com.netcodebr.storage"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Clonar repositório
        uses: actions/checkout@v4

      - name: ⚙️ Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jdk
          npm install -g @bubblewrap/cli

      - name: 📦 Gerar APK automaticamente
        run: |
          mkdir -p android_build
          cd android_build
          echo "🚀 Iniciando geração automática do APK..."
          yes | bubblewrap init --manifest=${{ github.event.inputs.pwa_url }}/manifest.webmanifest --directory=. --skipPwaValidation
          yes | bubblewrap build
          cd ..

      - name: 📤 Upload do APK gerado
        uses: actions/upload-artifact@v3
        with:
          name: ${{ github.event.inputs.app_name }}-APK
          path: android_build/output/app-release-signed.apk
