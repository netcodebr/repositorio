<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NELSON PLAYER</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#000;
    color:#fff;
    overflow:hidden;
    width: 100vw;
    height: 100vh;
}

/*==========================
    SPLASH SCREEN
==========================*/
#splash{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:99999;
    transition: 0.8s;
}

.logo-splash{
    font-size:clamp(40px, 10vw, 70px);
    font-weight:700;
    letter-spacing:10px;
    color:#fff;
    text-shadow: 0 0 15px #00aeff;
}

/*==========================
    ESTRUTURA
==========================*/
#app{
    display:none;
    height:100vh;
    width: 100%;
}

/* SIDEBAR */
aside{
    width:280px;
    background:#111;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    padding:20px;
    border-right:1px solid #1f1f1f;
    display: flex;
    flex-direction: column;
    z-index: 1000;
    transition: 0.3s ease;
}

main{
    margin-left:280px;
    width: calc(100% - 280px);
    height:100vh;
    display:flex;
    flex-direction:column;
    background: #050505;
}

/* HEADER */
header{
    height:70px;
    background:#111;
    display:flex;
    align-items:center;
    padding:0 15px;
    border-bottom:1px solid #1f1f1f;
    gap: 10px;
}

.menu-toggle{
    display: none;
    background: #222;
    border: none;
    color: #fff;
    padding: 10px;
    border-radius: 8px;
    font-size: 20px;
}

.busca{ 
    display:flex; 
    gap:5px; 
    flex: 1;
}

.busca input{
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 14px;
}

.btn-busca {
    background: #00aeff;
    color: white;
    border: none;
    padding: 0 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}

.btn-fav {
    background: #f1c40f;
    padding: 0 15px;
    border: none;
    border-radius: 8px;
}

/* LISTA FAVORITOS */
.perfil { text-align: center; margin-bottom: 20px; }
.avatar { width: 50px; height: 50px; background: #00aeff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-weight: bold; }

#listaFavoritos { flex: 1; overflow-y: auto; }
.fav-item {
    background: #1a1a1a;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
}
.btn-del { background: #ff4444; border: none; color: #fff; padding: 5px 10px; border-radius: 5px; }

/* PLAYER - IMPORTANTE */
#playerArea{
    flex:1;
    background: #000;
    position: relative;
}

#mainPlayer {
    width: 100%;
    height: 100%;
    border: none;
}

/* RESPONSIVIDADE */
@media (max-width: 768px) {
    aside { left: -280px; }
    aside.active { left: 0; }
    main { margin-left: 0; width: 100%; }
    .menu-toggle { display: block; }
    
    .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        z-index: 998;
    }
    .overlay.active { display: block; }
}
</style>
</head>
<body>

<div id="splash">
    <div class="logo-splash">NELSON</div>
    <p style="color: #555; letter-spacing: 5px;">PLAYER</p>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div id="app">
    <aside id="aside">
        <div class="perfil">
            <div class="avatar">N</div>
            <p>NELSON IPTV</p>
        </div>
        <p style="font-size: 12px; color: #00aeff; margin-bottom: 10px;">⭐ MEUS FAVORITOS</p>
        <div id="listaFavoritos"></div>
    </aside>

    <main>
        <header>
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <div class="busca">
                <input type="text" id="canalInput" placeholder="ID do canal..." value="gloob">
                <button class="btn-busca" onclick="abrirCanal()">VER</button>
                <button class="btn-fav" onclick="salvarFavorito()">★</button>
            </div>
        </header>

        <div id="playerArea">
            <!-- REMOVIDO SANDBOX PARA EVITAR ERRO NO CELULAR -->
            <iframe 
                id="mainPlayer" 
                src="" 
                allowfullscreen="true" 
                webkitallowfullscreen="true" 
                mozallowfullscreen="true" 
                scrolling="no"
                frameborder="0"
                allow="autoplay; encrypted-media">
            </iframe>
        </div>
    </main>
</div>

<script>
    // Splash
    window.onload = () => {
        setTimeout(() => {
            document.getElementById("splash").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("splash").style.display = "none";
                document.getElementById("app").style.display = "flex";
                carregarFavoritos();
                abrirCanal();
            }, 800);
        }, 1500);
    };

    function toggleMenu() {
        document.getElementById("aside").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }

    function abrirCanal() {
        const canal = document.getElementById("canalInput").value.trim();
        if (canal !== "") {
            const url = "https://redecanaistv.win/player3/ch.php?canal=" + encodeURIComponent(canal);
            document.getElementById("mainPlayer").src = url;
            
            // Fecha menu no mobile
            document.getElementById("aside").classList.remove("active");
            document.getElementById("overlay").classList.remove("active");
        }
    }

    // Favoritos
    let favoritos = JSON.parse(localStorage.getItem('n_favs')) || [];

    function salvarFavorito() {
        const canal = document.getElementById("canalInput").value.trim().toLowerCase();
        if (canal && !favoritos.includes(canal)) {
            favoritos.push(canal);
            localStorage.setItem('n_favs', JSON.stringify(favoritos));
            carregarFavoritos();
        }
    }

    function removerFavorito(canal) {
        favoritos = favoritos.filter(f => f !== canal);
        localStorage.setItem('n_favs', JSON.stringify(favoritos));
        carregarFavoritos();
        event.stopPropagation();
    }

    function carregarFavoritos() {
        const lista = document.getElementById("listaFavoritos");
        lista.innerHTML = "";
        favoritos.forEach(canal => {
            const item = document.createElement("div");
            item.className = "fav-item";
            item.onclick = () => { document.getElementById("canalInput").value = canal; abrirCanal(); };
            item.innerHTML = `<span>📺 ${canal.toUpperCase()}</span><button class="btn-del" onclick="removerFavorito('${canal}')">X</button>`;
            lista.appendChild(item);
        });
    }

    document.getElementById("canalInput").addEventListener("keydown", (e) => {
        if(e.key === "Enter") abrirCanal();
    });
</script>

</body>
</html>
