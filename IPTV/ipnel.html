<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NELSON PLAYER - IPTV</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b0b0b;
    color:#fff;
    overflow:hidden;
    width: 100vw;
    height: 100vh;
}

/*==========================
    SPLASH SCREEN
==========================*/
#splash{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:99999;
    transition: 0.8s;
}

.logo{
    font-size:70px;
    font-weight:700;
    letter-spacing:12px;
    color:#fff;
    animation: logo-anim 2s infinite alternate;
}

@keyframes logo-anim{
    0%{ text-shadow: 0 0 5px #00aeff, 0 0 15px #00aeff; transform:scale(1); }
    100%{ text-shadow: 0 0 15px #00aeff, 0 0 35px #00aeff, 0 0 60px #00aeff; transform:scale(1.05); }
}

.loader{
    width:220px;
    height:5px;
    background:#222;
    margin-top:40px;
    border-radius:20px;
    overflow:hidden;
}

.loader span{
    display:block;
    height:100%;
    width:0%;
    background:#00aeff;
    animation: carregar-barra 2s forwards;
}

@keyframes carregar-barra{ 100%{ width:100%; } }

/*==========================
    ESTRUTURA DO APP
==========================*/
#app{
    display:none;
    height:100vh;
    width: 100%;
}

aside{
    width:280px;
    background:#111;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    padding:20px;
    border-right:1px solid #1f1f1f;
    display: flex;
    flex-direction: column;
}

.perfil{ text-align:center; margin-bottom:30px; }
.avatar{
    width:60px; height:60px; border-radius:50%;
    background:#00aeff; display:flex; justify-content:center;
    align-items:center; font-size:25px; font-weight:bold; margin:auto;
}

/* FAVORITOS */
.fav-header {
    font-size: 14px;
    color: #00aeff;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 15px;
    border-bottom: 1px solid #222;
    padding-bottom: 5px;
}

#listaFavoritos {
    flex: 1;
    overflow-y: auto;
}

.fav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #181818;
    margin-bottom: 8px;
    padding: 10px;
    border-radius: 8px;
    transition: 0.3s;
    cursor: pointer;
}

.fav-item:hover {
    background: #252525;
}

.fav-nome {
    flex: 1;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.btn-del {
    background: #ff4444;
    color: white;
    border: none;
    padding: 2px 8px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 10px;
}

.btn-del:hover { background: #cc0000; }

/* MAIN CONTENT */
main{
    margin-left:280px;
    width: calc(100% - 280px);
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    height:70px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    border-bottom:1px solid #1f1f1f;
}

.busca{ display:flex; gap:10px; }
.busca input{
    width:250px; padding:10px; border:none;
    border-radius:8px; background:#222; color:white;
}
.btn-busca {
    padding:10px 15px; border:none; background:#00aeff;
    color:white; border-radius:8px; cursor:pointer; font-weight: bold;
}
.btn-fav {
    background: #f1c40f;
    color: #000;
    border: none;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 18px;
}

#playerArea{
    flex:1;
    background: #000;
    padding: 10px;
    position: relative;
}

/* O BLOQUEADOR DE CLIQUES FANTASMAS (OPCIONAL) */
#mainPlayer {
    width: 100%;
    height: 100%;
    border: none;
    border-radius: 10px;
    background: #000;
}

footer{
    height:35px; background:#111;
    display:flex; justify-content:center; align-items:center;
    font-size:12px; color:#555;
}
</style>
</head>
<body>

<div id="splash">
    <div class="logo">NELSON</div>
    <div class="loader"><span></span></div>
</div>

<div id="app">
    <aside>
        <div class="perfil">
            <div class="avatar">N</div>
            <div class="nome">NELSON PLAYER</div>
        </div>
        
        <div class="fav-header">⭐ Meus Favoritos</div>
        <div id="listaFavoritos"></div>
    </aside>

    <main>
        <header>
            <h2 id="status">PLAYER PRONTO</h2>
            <div class="busca">
                <input type="text" id="canalInput" placeholder="Digite o ID do canal..." value="gloob">
                <button class="btn-busca" onclick="abrirCanal()">ASSISTIR</button>
                <button class="btn-fav" onclick="salvarFavorito()" title="Salvar nos favoritos">★</button>
            </div>
        </header>

        <div id="playerArea">
            <!-- Atributo sandbox adicionado para bloquear anúncios e popups -->
            <iframe 
                id="mainPlayer" 
                allowfullscreen 
                allow="encrypted-media"
                sandbox="allow-forms allow-pointer-lock allow-same-origin allow-scripts">
            </iframe>
        </div>

        <footer>
            © 2026 Nelson Player • Filtro Anti-Popups Ativado 🛡️
        </footer>
    </main>
</div>

<script>
    // Gerenciamento do Splash
    window.onload = () => {
        setTimeout(() => {
            document.getElementById("splash").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("splash").style.display = "none";
                document.getElementById("app").style.display = "flex";
                carregarFavoritos();
                abrirCanal();
            }, 800);
        }, 2000);
    };

    // Lógica do Player
    function abrirCanal() {
        const canal = document.getElementById("canalInput").value.trim();
        const player = document.getElementById("mainPlayer");
        const status = document.getElementById("status");
        
        if (canal !== "") {
            // Atualiza o SRC e limpa o sandbox momentaneamente se necessário
            player.src = "https://redecanaistv.win/player3/ch.php?canal=" + encodeURIComponent(canal);
            status.innerText = "ASSISTINDO: " + canal.toUpperCase();
        }
    }

    // Lógica de Favoritos
    let favoritos = JSON.parse(localStorage.getItem('nelson_favs')) || [];

    function salvarFavorito() {
        const canal = document.getElementById("canalInput").value.trim().toLowerCase();
        if (canal === "") return;

        if (!favoritos.includes(canal)) {
            favoritos.push(canal);
            localStorage.setItem('nelson_favs', JSON.stringify(favoritos));
            carregarFavoritos();
        }
    }

    function removerFavorito(canal) {
        favoritos = favoritos.filter(f => f !== canal);
        localStorage.setItem('nelson_favs', JSON.stringify(favoritos));
        carregarFavoritos();
        event.stopPropagation();
    }

    function carregarFavoritos() {
        const lista = document.getElementById("listaFavoritos");
        lista.innerHTML = "";

        if (favoritos.length === 0) {
            lista.innerHTML = "<p style='color:#555; font-size:13px;'>Nenhum favorito salvo.</p>";
            return;
        }

        favoritos.forEach(canal => {
            const item = document.createElement("div");
            item.className = "fav-item";
            item.onclick = () => {
                document.getElementById("canalInput").value = canal;
                abrirCanal();
            };
            
            item.innerHTML = `
                <span class="fav-nome">📺 ${canal.toUpperCase()}</span>
                <button class="btn-del" onclick="removerFavorito('${canal}')">X</button>
            `;
            lista.appendChild(item);
        });
    }

    document.getElementById("canalInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") abrirCanal();
    });
</script>

</body>
</html>
