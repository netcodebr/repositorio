<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NELSON PLAYER - IPTV</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
/* GERAL */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#0b0b0b;
    color:#fff;
    overflow:hidden;
    width: 100vw;
    height: 100vh;
}

/*==========================
    SPLASH SCREEN
==========================*/
#splash{
    position:fixed;
    inset:0;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:99999;
    transition: 0.8s;
}

.logo-splash{
    font-size:clamp(40px, 10vw, 70px);
    font-weight:700;
    letter-spacing:10px;
    color:#fff;
    animation: logo-anim 2s infinite alternate;
}

@keyframes logo-anim{
    0%{ text-shadow: 0 0 5px #00aeff, 0 0 15px #00aeff; transform:scale(1); }
    100%{ text-shadow: 0 0 15px #00aeff, 0 0 35px #00aeff, 0 0 60px #00aeff; transform:scale(1.05); }
}

.loader{
    width:200px;
    height:4px;
    background:#222;
    margin-top:30px;
    border-radius:20px;
    overflow:hidden;
}

.loader span{
    display:block;
    height:100%;
    width:0%;
    background:#00aeff;
    animation: carregar-barra 2s forwards;
}

@keyframes carregar-barra{ 100%{ width:100%; } }

/*==========================
    ESTRUTURA DO APP
==========================*/
#app{
    display:none;
    height:100vh;
    width: 100%;
}

/* BARRA LATERAL (ASIDE) */
aside{
    width:280px;
    background:#111;
    height:100vh;
    position:fixed;
    left:0;
    top:0;
    padding:20px;
    border-right:1px solid #1f1f1f;
    display: flex;
    flex-direction: column;
    z-index: 1000;
    transition: 0.3s ease;
}

/* CONTEÚDO PRINCIPAL (MAIN) */
main{
    margin-left:280px;
    width: calc(100% - 280px);
    height:100vh;
    display:flex;
    flex-direction:column;
    transition: 0.3s ease;
}

/* HEADER */
header{
    height:70px;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 20px;
    border-bottom:1px solid #1f1f1f;
}

.menu-toggle{
    display: none; /* Escondido no PC */
    background: none;
    border: none;
    color: #fff;
    font-size: 24px;
    cursor: pointer;
}

.perfil{ text-align:center; margin-bottom:30px; }
.avatar{
    width:60px; height:60px; border-radius:50%;
    background:#00aeff; display:flex; justify-content:center;
    align-items:center; font-size:25px; font-weight:bold; margin:auto;
}

.fav-header {
    font-size: 14px;
    color: #00aeff;
    text-transform: uppercase;
    margin-bottom: 15px;
    padding-bottom: 5px;
    border-bottom: 1px solid #222;
}

#listaFavoritos {
    flex: 1;
    overflow-y: auto;
}

.fav-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #181818;
    margin-bottom: 10px;
    padding: 12px;
    border-radius: 8px;
    cursor: pointer;
}

.fav-nome { font-size: 13px; font-weight: 500; }
.btn-del {
    background: #ff4444;
    color: white;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
}

/* BUSCA */
.busca{ display:flex; gap:8px; flex: 1; justify-content: flex-end; }
.busca input{
    width: 100%;
    max-width: 200px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: white;
    font-size: 14px;
}
.btn-busca {
    background: #00aeff;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
}
.btn-fav {
    background: #f1c40f;
    padding: 10px 12px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
}

/* PLAYER AREA */
#playerArea{
    flex:1;
    background: #000;
    padding: 5px;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
    background: #000;
}

footer{
    height:30px; background:#111;
    display:flex; justify-content:center; align-items:center;
    font-size:11px; color:#555;
}

/*==========================
    RESPONSIVIDADE (CELULAR)
==========================*/
@media (max-width: 768px) {
    aside {
        left: -280px; /* Esconde a barra lateral */
    }
    
    aside.active {
        left: 0; /* Mostra a barra lateral ao clicar */
    }

    main {
        margin-left: 0;
        width: 100%;
    }

    .menu-toggle {
        display: block; /* Mostra botão hambúrguer */
        margin-right: 15px;
    }

    header h2 {
        display: none; /* Esconde título longo para sobrar espaço */
    }

    .busca input {
        max-width: 150px;
    }
    
    .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.7);
        z-index: 999;
    }
    
    .overlay.active {
        display: block;
    }
}
</style>
</head>
<body>

<div id="splash">
    <div class="logo-splash">NELSON</div>
    <div class="loader"><span></span></div>
</div>

<!-- Overlay para fechar menu no mobile -->
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div id="app">
    <aside id="aside">
        <div class="perfil">
            <div class="avatar">N</div>
            <div class="nome">NELSON PLAYER</div>
        </div>
        
        <div class="fav-header">⭐ MEUS FAVORITOS</div>
        <div id="listaFavoritos"></div>
    </aside>

    <main>
        <header>
            <button class="menu-toggle" onclick="toggleMenu()">☰</button>
            <h2 style="font-size: 18px; letter-spacing: 1px;">NELSON IPTV</h2>
            
            <div class="busca">
                <input type="text" id="canalInput" placeholder="ID do canal..." value="gloob">
                <button class="btn-busca" onclick="abrirCanal()">VER</button>
                <button class="btn-fav" onclick="salvarFavorito()">★</button>
            </div>
        </header>

        <div id="playerArea">
            <iframe id="mainPlayer" allowfullscreen allow="encrypted-media"></iframe>
        </div>

        <footer>
            © 2026 Nelson Player • v1.5 Responsivo
        </footer>
    </main>
</div>

<script>
    // Gerenciamento do Splash
    window.onload = () => {
        setTimeout(() => {
            document.getElementById("splash").style.opacity = "0";
            setTimeout(() => {
                document.getElementById("splash").style.display = "none";
                document.getElementById("app").style.display = "flex";
                carregarFavoritos();
                abrirCanal();
            }, 800);
        }, 2000);
    };

    // Toggle Menu Mobile
    function toggleMenu() {
        document.getElementById("aside").classList.toggle("active");
        document.getElementById("overlay").classList.toggle("active");
    }

    // Lógica do Player
    function abrirCanal() {
        const canal = document.getElementById("canalInput").value.trim();
        const player = document.getElementById("mainPlayer");
        
        if (canal !== "") {
            player.src = "https://redecanaistv.win/player3/ch.php?canal=" + encodeURIComponent(canal);
            // Fecha o menu no mobile ao carregar canal
            document.getElementById("aside").classList.remove("active");
            document.getElementById("overlay").classList.remove("active");
        }
    }

    // Lógica de Favoritos
    let favoritos = JSON.parse(localStorage.getItem('nelson_favs')) || [];

    function salvarFavorito() {
        const canal = document.getElementById("canalInput").value.trim().toLowerCase();
        if (canal === "" || favoritos.includes(canal)) return;
        favoritos.push(canal);
        localStorage.setItem('nelson_favs', JSON.stringify(favoritos));
        carregarFavoritos();
    }

    function removerFavorito(canal) {
        favoritos = favoritos.filter(f => f !== canal);
        localStorage.setItem('nelson_favs', JSON.stringify(favoritos));
        carregarFavoritos();
        event.stopPropagation();
    }

    function carregarFavoritos() {
        const lista = document.getElementById("listaFavoritos");
        lista.innerHTML = "";
        
        if(favoritos.length === 0) {
            lista.innerHTML = "<p style='color:#444; font-size:12px; text-align:center;'>Sem favoritos.</p>";
        }

        favoritos.forEach(canal => {
            const item = document.createElement("div");
            item.className = "fav-item";
            item.onclick = () => { 
                document.getElementById("canalInput").value = canal; 
                abrirCanal(); 
            };
            item.innerHTML = `
                <span class="fav-nome">📺 ${canal.toUpperCase()}</span>
                <button class="btn-del" onclick="removerFavorito('${canal}')">X</button>
            `;
            lista.appendChild(item);
        });
    }

    // Atalho Enter
    document.getElementById("canalInput").addEventListener("keydown", function(e) {
        if (e.key === "Enter") abrirCanal();
    });
</script>

</body>
</html>
