<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NELSON PLAYER - SELEÇÃO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <style>
        :root { --blue: #00aeff; --dark: #0b0b0b; --gray: #1a1a1a; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body { background: var(--dark); color: #fff; overflow: hidden; height: 100vh; }

        /* SPLASH */
        #splash { position:fixed; inset:0; background:#000; display:flex; justify-content:center; align-items:center; flex-direction:column; z-index:99999; transition:0.8s; }
        .logo { font-size: 50px; font-weight:700; letter-spacing:10px; color:#fff; text-shadow: 0 0 20px var(--blue); }

        /* SELEÇÃO DE MODO */
        #modoSelecao { 
            position: fixed; inset: 0; background: #000; z-index: 9999; 
            display: none; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
        }
        .card-modo {
            width: 80%; max-width: 300px; padding: 30px; background: var(--gray);
            border-radius: 20px; text-align: center; cursor: pointer; transition: 0.3s;
            border: 2px solid transparent;
        }
        .card-modo:hover { border-color: var(--blue); transform: scale(1.05); }
        .card-modo i { font-size: 50px; display: block; margin-bottom: 10px; }

        /* APP LAYOUT */
        #app { display:none; height:100vh; flex-direction: column; }
        
        /* BARRA REMOTA */
        #remoteBar { background: #000; padding: 8px 15px; border-bottom: 1px solid #222; display: flex; align-items: center; gap: 10px; font-size: 12px; }
        #remoteBar input { background: #111; border: 1px solid #333; color: var(--blue); padding: 4px 8px; border-radius: 4px; width: 120px; }
        .dot { width: 8px; height: 8px; background: #333; border-radius: 50%; }
        .online { background: #00ff00; box-shadow: 0 0 8px #00ff00; }

        /* SIDEBAR */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        aside { width: 280px; background: #111; border-right: 1px solid #222; padding: 20px; display: flex; flex-direction: column; }
        
        /* PLAYER & CONTROLES */
        main { flex: 1; display: flex; flex-direction: column; position: relative;}
        header { height: 70px; background: #111; padding: 0 20px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; }
        .busca { flex: 1; display: flex; gap: 8px; }
        .busca input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; }
        
        button { border: none; cursor: pointer; font-weight: 600; border-radius: 8px; }
        .btn-play { background: var(--blue); color: #fff; padding: 0 20px; }
        .btn-fav { background: #f1c40f; padding: 0 15px; font-size: 20px; }
        .btn-reset { background: #333; color: #ccc; font-size: 10px; padding: 5px; margin-left: auto;}

        #playerArea { flex: 1; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }

        /* ESTILO MODO CONTROLE */
        body.modo-controle #playerArea { display: none; }
        body.modo-controle aside { width: 100%; border: none; }
        body.modo-controle .main-container { flex-direction: column; }

        .fav-item { background: var(--gray); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body class="">

    <!-- 1. SPLASH -->
    <div id="splash">
        <div class="logo">NELSON</div>
    </div>

    <!-- 2. SELEÇÃO DE MODO -->
    <div id="modoSelecao">
        <h2 style="margin-bottom: 20px;">Como deseja usar?</h2>
        <div class="card-modo" onclick="setModo('display')">
            <i>📺</i>
            <h3>MODO TELA</h3>
            <p style="font-size: 12px; color: #888;">Para assistir no PC ou TV</p>
        </div>
        <div class="card-modo" onclick="setModo('remote')">
            <i>📱</i>
            <h3>MODO CONTROLE</h3>
            <p style="font-size: 12px; color: #888;">Para controlar pelo celular</p>
        </div>
    </div>

    <!-- 3. APP -->
    <div id="app">
        <div id="remoteBar">
            <div id="statusDot" class="dot"></div>
            <span>COD:</span>
            <input type="text" id="syncID" placeholder="Ex: 123" oninput="configurarRemoto()">
            <span id="remoteStatus">Offline</span>
            <button class="btn-reset" onclick="resetModo()">Trocar Modo</button>
        </div>

        <div class="main-container">
            <aside id="sidebarFavoritos">
                <p style="font-size: 12px; color: var(--blue); margin-bottom: 15px;">⭐ FAVORITOS / CANAIS</p>
                <div id="listaFavoritos"></div>
            </aside>

            <main>
                <header id="headerBusca">
                    <div class="busca">
                        <input type="text" id="canalInput" placeholder="ID do Canal..." value="gloob">
                        <button class="btn-play" onclick="dispararCanal(true)">ENVIAR</button>
                        <button class="btn-fav" onclick="salvarFavorito()">★</button>
                    </div>
                </header>
                <div id="playerArea">
                    <iframe id="mainPlayer" allowfullscreen allow="autoplay; encrypted-media"></iframe>
                </div>
            </main>
        </div>
    </div>

<script>
    // CONFIGURAÇÃO DO SEU FIREBASE
    const firebaseConfig = {
    apiKey: "AIzaSyAmJBAfbaWCaFQJiQgEUEpzSbxF0q97VoU",
    authDomain: "iptvjr.firebaseapp.com",
    projectId: "iptvjr",
    storageBucket: "iptvjr.firebasestorage.app",
    messagingSenderId: "621271517429",
    appId: "1:621271517429:web:0c266d7b97dafe53111dbc",
    measurementId: "G-FSQZ25CMVH"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentRole = ''; // 'display' ou 'remote'

    // Fluxo Inicial
    window.onload = () => {
        setTimeout(() => {
            document.getElementById("splash").style.display = "none";
            const modoSalvo = localStorage.getItem('user_role');
            if (modoSalvo) {
                setModo(modoSalvo);
            } else {
                document.getElementById("modoSelecao").style.display = "flex";
            }
        }, 1500);
    };

    function setModo(role) {
        currentRole = role;
        localStorage.setItem('user_role', role);
        document.getElementById("modoSelecao").style.display = "none";
        document.getElementById("app").style.display = "flex";
        
        if (role === 'remote') {
            document.body.classList.add('modo-controle');
        } else {
            document.body.classList.remove('modo-controle');
        }

        // Carregar configurações salvas
        const savedID = localStorage.getItem('remote_id');
        if(savedID) {
            document.getElementById('syncID').value = savedID;
            configurarRemoto();
        }
        carregarFavoritos();
        dispararCanal(false);
    }

    function resetModo() {
        localStorage.removeItem('user_role');
        location.reload();
    }

    function configurarRemoto() {
        const id = document.getElementById('syncID').value.trim();
        if(id.length < 3) return;
        localStorage.setItem('remote_id', id);
        document.getElementById('statusDot').className = "dot online";
        
        // Se for TELA, ele escuta o Firebase
        if(currentRole === 'display') {
            db.ref('nelson/' + id).on('value', (snap) => {
                const data = snap.val();
                if(data && data.canal) {
                    document.getElementById('canalInput').value = data.canal;
                    dispararCanal(false); 
                }
            });
        }
    }

    function dispararCanal(enviar) {
        const canal = document.getElementById('canalInput').value.trim();
        const id = document.getElementById('syncID').value.trim();
        
        if(!canal) return;

        // Só carrega o vídeo se for modo TELA
        if(currentRole === 'display') {
            document.getElementById('mainPlayer').src = "https://redecanaistv.win/player3/ch.php?canal=" + encodeURIComponent(canal);
        }

        // Se clicar em enviar ou mudar no controle, manda pro Firebase
        if(enviar && id) {
            db.ref('nelson/' + id).set({ canal: canal, time: Date.now() });
        }
    }

    // --- FAVORITOS ---
    let favoritos = JSON.parse(localStorage.getItem('n_favs')) || [];
    function salvarFavorito() {
        const canal = document.getElementById('canalInput').value.trim().toLowerCase();
        if(canal && !favoritos.includes(canal)) {
            favoritos.push(canal);
            localStorage.setItem('n_favs', JSON.stringify(favoritos));
            carregarFavoritos();
        }
    }
    function carregarFavoritos() {
        const lista = document.getElementById('listaFavoritos');
        lista.innerHTML = "";
        favoritos.forEach(canal => {
            const div = document.createElement('div');
            div.className = 'fav-item';
            div.onclick = () => { document.getElementById('canalInput').value = canal; dispararCanal(true); };
            div.innerHTML = `<span>📺 ${canal.toUpperCase()}</span><button style="color:red; background:none;" onclick="removerFav('${canal}')">X</button>`;
            lista.appendChild(div);
        });
    }
    function removerFav(canal) {
        favoritos = favoritos.filter(f => f !== canal);
        localStorage.setItem('n_favs', JSON.stringify(favoritos));
        carregarFavoritos();
        event.stopPropagation();
    }
</script>
</body>
</html>
