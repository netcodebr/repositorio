<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWABuilder NetcodeBR</title>
  <meta name="theme-color" content="#004aad" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <header>
    <img src="icons/icon-192.png" alt="logo" class="logo">
    <div>
      <h1>PWABuilder NetcodeBR</h1>
      <p>Gere seu app Android (.apk) diretamente do navegador</p>
    </div>
  </header>

  <main>
    <div class="input-area">
      <input type="url" id="pwaUrl" placeholder="Cole aqui a URL do seu PWA (https://...)" />
      <button id="analisarBtn">Analisar</button>
    </div>

    <section id="resultado" class="resultado hidden">
      <div id="manifestoInfo"></div>
      <div id="preview" class="preview hidden"></div>
      <div class="botoes">
        <button id="gerarZipBtn" class="hidden">📦 Baixar Projeto Android (.zip)</button>
        <button id="gerarGitBtn" class="hidden">⚙️ Gerar APK via GitHub Actions</button>
      </div>
    </section>
  </main>

  <footer>
    <p>⚙️ PWABuilder NetcodeBR © 2025 — Desenvolvido por Nelson Ferreira</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
