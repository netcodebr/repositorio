<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PWABuilder NetcodeBR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img src="icons/icon-192.png" class="logo" alt="Logo NetcodeBR" />
    <h1>PWABuilder NetcodeBR</h1>
    <p>Gere automaticamente um APK Android a partir do seu PWA hospedado!</p>
  </header>

  <main>
    <form id="apkForm">
      <label>🌐 URL do seu PWA</label>
      <input type="url" id="pwaUrl" placeholder="https://seuapp.github.io/" required />

      <label>📱 Nome do Aplicativo</label>
      <input type="text" id="appName" placeholder="Ex: Meu App PWA" required />

      <label>🧩 ID do Pacote (ex: br.com.netcodebr.app)</label>
      <input type="text" id="packageId" placeholder="br.com.netcodebr.meupwa" required />

      <button type="submit">🚀 Gerar APK</button>
    </form>

    <section id="status" class="status">
      <p>Aguardando envio...</p>
    </section>

    <div id="apkLink" class="apk-link" style="display:none;">
      <a id="downloadLink" href="#" target="_blank" class="btn-download">⬇️ Baixar APK Gerado</a>
    </div>
  </main>

  <footer>
    <p>© 2025 NetcodeBR — Desenvolvido por Nelson Ferreira</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
