<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>🎧 Metropolitana FM - 98.5 SP</title>

  <!-- 🔹 Ícone oficial -->
  <link rel="icon" type="image/webp" href="https://www.cxradio.com.br/img/Radio/Logo/98b3ed2f039f78d6c2f28b1a700233ef.webp">
  <link rel="apple-touch-icon" href="https://www.cxradio.com.br/img/Radio/Logo/98b3ed2f039f78d6c2f28b1a700233ef.webp">

  <!-- 📱 PWA básico -->
  <meta name="theme-color" content="#004aad">
  <meta name="background-color" content="#0a1020">
  <meta name="application-name" content="Metropolitana FM">
  <link rel="manifest" href="manifest.webmanifest">

  <meta name="description" content="Ouça ao vivo a Rádio Metropolitana FM 98.5 de São Paulo. Muita música, diversão e energia no seu navegador.">

  <!-- 🎨 CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="player-container">
    <header class="topo">
      <img src="https://cdn.instant.audio/images/logos/radiosaovivo-net/metropolitana-online.png"
           alt="Metropolitana FM" class="logo">
      <div class="info-titulo">
        <h1>Metropolitana FM</h1>
        <p class="freq">98.5 FM • São Paulo</p>
      </div>
    </header>

    <main class="painel">
      <div id="ondas" class="ondas">
        <span></span><span></span><span></span><span></span><span></span>
      </div>

      <p id="musica" class="musica">🎵 Metropolitana FM — Ao vivo</p>

      <div id="btnPlayPause" class="botao">
        <!-- ▶️ Ícone Play -->
        <svg id="iconPlay" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512">
          <path fill="currentColor"
            d="M361 215C375.3 223.8 384 239.3 384 256C384 272.7 375.3 288.2 361 296.1L73.03 472.1C58.21 482 39.66 482.4 24.52 473.9C9.377 465.4 0 449.4 0 432V80C0 62.64 9.377 46.63 24.52 38.13C39.66 29.64 58.21 29.99 73.03 39.04L361 215z"/>
        </svg>

        <!-- ⏸️ Ícone Pause -->
        <svg id="iconPause" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512" style="display:none">
          <path fill="currentColor"
            d="M272 63.1l-32 0c-26.51 0-48 21.49-48 47.1v288c0 26.51 21.49 48 48 48L272 448c26.51 0 48-21.49 48-48v-288C320 85.49 298.5 63.1 272 63.1zM80 63.1l-32 0c-26.51 0-48 21.49-48 48v288C0 426.5 21.49 448 48 448l32 0c26.51 0 48-21.49 48-48v-288C128 85.49 106.5 63.1 80 63.1z"/>
        </svg>
      </div>

      <p id="estado" class="estado">⏳ Conectando...</p>
    </main>

    <footer>
      <p>🔊 Transmitindo via <strong>Fábrica Host</strong></p>
    </footer>
  </div>

  <script>
    // 🎧 Servidores oficiais HTTPS da Metropolitana
    const STREAMS = [
      "https://e-spo-102.fabricahost.com.br/metropolitana985sp?f=1762546679N01K9FZFZXSCDFS8J2GTJ3SW3M8&tid=01K9FZFZXSEZFWABNHTBP02SHF",
      "https://ice-br.fabricahost.com.br/play/metropolitana985sp?1762546703715",
      "https://ice.fabricahost.com.br/metropolitana985sp?1762546703715"
    ];

    const player = new Audio();
    player.preload = "none";
    player.volume = 1.0;

    const btn = document.getElementById("btnPlayPause");
    const iconPlay = document.getElementById("iconPlay");
    const iconPause = document.getElementById("iconPause");
    const estadoEl = document.getElementById("estado");
    const painel = document.querySelector(".painel");
    let tocando = false;
    let current = 0;

    async function tentarStream() {
      const url = STREAMS[current];
      player.src = url;
      try {
        await player.play();
        tocando = true;
        iconPlay.style.display = "none";
        iconPause.style.display = "inline";
        painel.classList.add("tocando");
        estadoEl.textContent = `✅ Conectado (Servidor ${current + 1})`;
      } catch {
        estadoEl.textContent = `⚠️ Falha no servidor ${current + 1}`;
        current = (current + 1) % STREAMS.length;
        setTimeout(tentarStream, 1200);
      }
    }

    btn.onclick = () => {
      if (!tocando) {
        tentarStream();
      } else {
        player.pause();
        tocando = false;
        iconPlay.style.display = "inline";
        iconPause.style.display = "none";
        painel.classList.remove("tocando");
        estadoEl.textContent = "⏸️ Pausado";
      }
    };

    player.onerror = () => {
      tocando = false;
      painel.classList.remove("tocando");
      iconPlay.style.display = "inline";
      iconPause.style.display = "none";
      estadoEl.textContent = "🚫 Rádio fora do ar, tentando outro servidor...";
      current = (current + 1) % STREAMS.length;
      setTimeout(tentarStream, 3000);
    };
  </script>
</body>
</html>
