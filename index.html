<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satélite Meteorologia — AO VIVO</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html,body,#map {height:100%;margin:0;}
  body{background:#000;font-family:Inter,Segoe UI,Roboto,sans-serif;color:#fff;}
  .info{
    position:absolute;top:10px;left:10px;z-index:1000;
    background:rgba(0,0,0,0.6);padding:10px 15px;border-radius:8px;
    font-size:14px;line-height:1.4;box-shadow:0 0 12px rgba(0,0,0,0.5);
    backdrop-filter:blur(4px);
  }
  .info h1{font-size:16px;margin:0 0 6px 0;}
  .dot{display:inline-block;width:10px;height:10px;background:red;border-radius:50%;
    margin-right:6px;animation:pulse 1s infinite;}
  @keyframes pulse{
    0%{opacity:.3;transform:scale(.9);}
    50%{opacity:1;transform:scale(1.3);}
    100%{opacity:.3;transform:scale(.9);}
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="info">
  <div><span class="dot"></span><strong>AO VIVO</strong> — Satélite Meteorológico</div>
  <div>Fonte: NASA GIBS • GOES-16 GeoColor</div>
  <div id="time">Atualizando...</div>
</div>

<script>
// ==========================
// MAPA BASE
// ==========================
const map = L.map('map', {
  center:[-15.8,-47.9],
  zoom:4,
  zoomControl:false
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,
  attribution:'© OpenStreetMap'
}).addTo(map);

// ==========================
// CAMADA GOES-16 (NASA GIBS)
// ==========================
let goesLayer;

function buildGIBSUrl(time){
  // formato exigido pela API GIBS WMTS
  return `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/GOES-East_ABI_GeoColor/default/${time}/GoogleMapsCompatible_Level{z}/{z}/{y}/{x}.jpg`;
}

// gera timestamp ISO reduzido (última hora arredondada)
function getRoundedTime(){
  const now=new Date();
  now.setUTCMinutes(0,0,0);           // arredonda pra hora cheia
  return now.toISOString().split('.')[0]+'Z';
}

function updateLayer(){
  const time=getRoundedTime();
  const url=buildGIBSUrl(time);

  if(goesLayer) map.removeLayer(goesLayer);

  goesLayer=L.tileLayer(url,{
    maxZoom:8,
    opacity:0.95,
    attribution:'NASA GIBS / GOES-16'
  }).addTo(map);

  document.getElementById('time').textContent=
    'Última atualização: '+new Date().toLocaleString('pt-BR');
}

// atualiza imediatamente e depois a cada minuto
updateLayer();
setInterval(updateLayer,60*1000);
</script>

</body>
</html>
