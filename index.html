<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Satélite Meteorologia — AO VIVO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  html,body,#map {height:100%;margin:0;}
  body{background:#000;font-family:Inter,Segoe UI,Roboto,sans-serif;color:#fff;}
  .info{
    position:absolute;top:10px;left:10px;z-index:1000;
    background:rgba(0,0,0,0.65);padding:10px 14px;border-radius:10px;
    font-size:14px;line-height:1.4;box-shadow:0 0 12px rgba(0,0,0,0.5);
    backdrop-filter:blur(5px);
  }
  .dot{display:inline-block;width:10px;height:10px;background:red;border-radius:50%;
    margin-right:6px;animation:pulse 1s infinite;}
  @keyframes pulse{
    0%{opacity:.3;transform:scale(.9);}
    50%{opacity:1;transform:scale(1.3);}
    100%{opacity:.3;transform:scale(.9);}
  }
</style>
</head>
<body>

<div id="map"></div>

<div class="info">
  <div><span class="dot"></span><strong>AO VIVO</strong> — Satélite Meteorológico</div>
  <div>Fonte: NASA GIBS — GOES-16 GeoColor + Infravermelho</div>
  <div id="status">Atualizando...</div>
</div>

<script>
const map = L.map('map',{
  center:[-15,-55],
  zoom:4,
  zoomControl:false
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:10,
  attribution:'© OpenStreetMap'
}).addTo(map);

// ===============================
// Funções auxiliares
// ===============================
function formatTimeForGIBS(){
  // Arredonda para o último múltiplo de 10 minutos UTC
  const now = new Date();
  const mins = Math.floor(now.getUTCMinutes()/10)*10;
  now.setUTCMinutes(mins,0,0);
  return now.toISOString().split('.')[0]+'Z';
}

// ===============================
// Cria camada GOES-16
// ===============================
function createGoesLayer(layerName,time,opacity){
  return L.tileLayer(
    `https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${layerName}/default/${time}/GoogleMapsCompatible_Level{z}/{z}/{y}/{x}.jpg`,
    {maxZoom:8,opacity,attribution:'NASA GIBS'}
  );
}

let visibleLayer, infraredLayer;

function updateSatellite(){
  const time = formatTimeForGIBS();
  if(visibleLayer) map.removeLayer(visibleLayer);
  if(infraredLayer) map.removeLayer(infraredLayer);

  // GeoColor (visível)
  visibleLayer = createGoesLayer('GOES-East_ABI_GeoColor',time,0.85).addTo(map);
  // Infravermelho (nuvens + temperatura de topo)
  infraredLayer = createGoesLayer('GOES-East_ABI_Band13_Clean_Infrared_10.3um',time,0.45).addTo(map);

  document.getElementById('status').textContent =
    'Última atualização: '+ new Date().toLocaleString('pt-BR');
}

// Atualiza continuamente (1 min)
updateSatellite();
setInterval(updateSatellite,60*1000);
</script>

</body>
</html>
